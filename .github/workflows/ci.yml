name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml to re-run every check on the tag

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.8.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0 }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make integration

  image:
    runs-on: ubuntu-latest
    needs: [lint, test, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build args
        id: args
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Only main gets published, as edge and sha-<7>, for testing on the NAS.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.args.outputs.image }}:edge
            ${{ steps.args.outputs.image }}:sha-${{ steps.args.outputs.sha }}
          build-args: |
            VERSION=0.0.0-dev+${{ steps.args.outputs.sha }}
            COMMIT=${{ steps.args.outputs.sha }}
            DATE=${{ steps.args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
