name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Re-run every check on the tagged commit: do not trust that main was green.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # requested by ci.yml's image job; it only pushes on main

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build args
        id: args
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.args.outputs.image }}
          # vX.Y.Z, vX.Y, vX and (automatically, for non-prereleases) latest.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.args.outputs.sha }}
            DATE=${{ steps.args.outputs.date }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, GitHub OIDC)
        run: cosign sign --yes "${{ steps.args.outputs.image }}@${{ steps.build.outputs.digest }}"
      - name: Static binaries
        run: make release-binaries VERSION=${{ github.ref_name }} COMMIT=${{ steps.args.outputs.sha }} DATE=${{ steps.args.outputs.date }}
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
